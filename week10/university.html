<!DOCTYPE html>
<html>
<head>
    <title>University Finder</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        #result div {
            background: #f7f7f7;
            margin: 10px 0;
            padding: 10px;
            border-left: 4px solid #007bff;
        }
        input, button {
            padding: 8px;
            font-size: 16px;
        }
        button { cursor: pointer; }
    </style>
</head>
<body>

<h2>Search Universities by Country</h2>

<input type="text" id="countryInput" placeholder="Enter country name (e.g., India)">
<button onclick="searchUniversity()">Search</button>

<h3>Results:</h3>
<div id="result"></div>

<script>
function searchUniversity() {
    let country = document.getElementById("countryInput").value.trim();

    if (country === "") {
        alert("Please enter a country name!");
        return;
    }

    let url = `https://universities.hipolabs.com/search?country=${country}`;

    fetch(url)
        .then(response => response.json())
        .then(data => {
            let resultDiv = document.getElementById("result");
            resultDiv.innerHTML = ""; // clear old results

            if (data.length === 0) {
                resultDiv.innerHTML = "<p>No universities found.</p>";
                return;
            }

            data.forEach(uni => {
                let box = document.createElement("div");

                box.innerHTML = `
                    <strong>Name:</strong> ${uni.name} <br>
                    <strong>State:</strong> ${uni["state-province"] || "N/A"} <br>
                    <strong>Website:</strong>
                    <a href="${uni.web_pages[0]}" target="_blank">${uni.web_pages[0]}</a>
                `;

                resultDiv.appendChild(box);
            });
        })
        .catch(error => {
            console.error("Error:", error);
            document.getElementById("result").innerHTML = "Something went wrong!";
        });
}
</script>

</body>
</html>
