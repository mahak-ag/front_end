<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple 3‑Column Blog (Flexbox)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #333;
      color: white;
      padding: 15px;
      text-align: center;
    }

    /* Main blog container */
    .blog-container {
      display: flex;
      gap: 10px;
      padding: 10px;
    }

    /* Columns */
    .column {
      background: white;
      padding: 15px;
      border-radius: 5px;
      flex: 1;
    }

    /* Make sure text looks clean */
    .column h2 { margin-top: 0; }

    /* Responsive for mobile */
    @media (max-width: 768px) {
      .blog-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>My Simple Blog</h1>
</header>

<div class="blog-container">
  <div class="column">
    <h2>Left Sidebar</h2>
    <p>This is the left section. Add links, categories, and more here.</p>
  </div>

  <div class="column">
    <h2>Main Content</h2>
    <p>This is the main blog content section where articles appear.</p>
  </div>

  <div class="column">
    <h2>Right Sidebar</h2>
    <p>This is the right section. Add ads, posts, or info here.</p>
  </div>
</div>

</body>
</html>
