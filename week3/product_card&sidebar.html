<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCT CARD</title>

    <style>
        body {
            background-color: antiquewhite;
        }

        h1 {
      color: sienna;
      padding: 15px;
      font-size: 50px;
      margin-left: 705px;
    }

    .sidebar {
      display: flex;
    }

    .side {
      width: 250px;
      background-color: rgb(60, 24, 8);
      color:antiquewhite;
      height: 100vh;
      padding: 20px 10px;
      position: fixed;
      top: 0;
      left: 0;
    }

    .side h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 30px;
      font-family: Arial, Helvetica, sans-serif;
    }

    .side ul {
      list-style: none;
      padding: 0;
      font-size: 20px;
      font-family:Georgia, 'Times New Roman', Times, serif;
      color: antiquewhite;
    }

    .side ul li {
      margin: 15px 0;
    }

    .side ul li a {
      text-decoration: none;
      color:beige;
      font-weight: bold;
      display: block;
      padding: 8px;
      border-radius: 5px;
      transition: 0.3s;
    }

    .side ul li a:hover {
      background-color: rgb(192, 141, 82);
    }

        .product {
          margin-left: 240px; 
      padding: 20px;
      flex-grow: 1;
        }

        .card {
            background-color: rgb(212, 148, 89);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px hsl(42, 59%, 24%);
            text-align: center;
             max-width: 300px;
             margin: 20px auto;
             font-family: Georgia, 'Times New Roman', Times, serif;
             color: antiquewhite;
             font-weight: bold;
        }

        .card img {
      max-width: 200%;
      border-radius: 10px;
      box-shadow: 0 0 10px hsl(42, 59%, 24%);
    }

    .card h3 {
      margin: 15px 0;
    }

    .card button {
       background: linear-gradient(45deg, hsl(71, 100%, 75%), #b3ff75, #ffbe6a); /* Gradient */
  transition: 0.3s;
  color: rgb(134, 79, 16);
  border: none;          
  outline: none;        
  padding: 10px 20px;
  margin-top: 10px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 16px;
  display: inline-block; 
  font-weight: bold;
    }
    
    .card button:focus {
  outline: none; 
}

    .card button:hover {
      background: linear-gradient(45deg, #d56910, #fca225); /* Change gradient on hover */
  transform: scale(1.05);
    }


    
    </style>
</head>
<body>

<h1>Product Card</h1>

  <div class="sidebar">

    <div class="side">
      <h2>Menu</h2>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Categories</a></li>
        <li><a href="#">Offers</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </div>
  </div>


  <div class="product">
    <div class="card">
        <img src="watch.jpeg">
        <h3>Ladies Watch</h3>
        <h4>Carlington Elite Ladies Self Adjustable Mesh Strap Water Resistant Analog Watch</h4>
      
        <div class="price">$7500</div>
        <div class="button">
            <button>Buy this product</button>
        </div>
       </div>
    </div>
    </div>
</body>
</html>
