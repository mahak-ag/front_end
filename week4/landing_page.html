<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Startup Landing Page</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="#">MyStartup</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Pricing</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- CAROUSEL -->
<div id="hero" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="https://picsum.photos/1200/400" class="d-block w-100">
      <div class="carousel-caption">
        <h2>Welcome to MyStartup</h2>
        <p>We help your business grow.</p>
      </div>
    </div>
  </div>
</div>

<!-- FEATURES SECTION -->
<div class="container text-center my-5">
  <h2>Our Features</h2>
  <div class="row mt-4">
    <div class="col-md-4">
      <div class="card p-3">
        <h4>Fast</h4>
        <p>Super quick service for all customers.</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3">
        <h4>Reliable</h4>
        <p>Always available to help you.</p>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3">
        <h4>Secure</h4>
        <p>Your data is safe with us.</p>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3">
  © 2025 MyStartup | All rights reserved
</footer>

</body>
</html>
