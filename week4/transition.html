<!DOCTYPE html>
<html>
<head>
  <style>
    nav {
      display: flex;
      gap: 20px;
      background: #222;
      padding: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 15px;
      transition: 0.3s; /* Smooth effect */
    }

    nav a:hover {
      background: #fff;
      color: #000;
      padding: 10px 18px; /* Slight size change */
      border-radius: 5px;
    }
  </style>
</head>

<body>

<nav>
  <a href="#">Home</a>
  <a href="#">Services</a>
  <a href="#">About</a>
  <a href="#">Contact</a>
</nav>

</body>
</html>
