<!DOCTYPE html>
<html>
<head>
    <title>Working Gallery</title>
    <style>
        #mainImage {
            width: 300px;
            border: 3px solid black;
            display: block;
            margin-bottom: 20px;
        }

        .thumbs img {
            width: 80px;
            margin-right: 10px;
            cursor: pointer;
            border: 2px solid #555;
        }
    </style>
</head>
<body>

<h2>Image Gallery</h2>

<!-- Main Image -->
<img id="mainImage" src="https://picsum.photos/id/101/300/200">

<!-- Thumbnails -->
<div id="thumbContainer" class="thumbs">
    <img src="https://picsum.photos/id/101/100/70" data-full="https://picsum.photos/id/101/300/200">
    <img src="https://picsum.photos/id/102/100/70" data-full="https://picsum.photos/id/102/300/200">
    <img src="https://picsum.photos/id/103/100/70" data-full="https://picsum.photos/id/103/300/200">
</div>

<script>
document.getElementById("thumbContainer")
.addEventListener("click", function(event) {

    if (event.target.tagName === "IMG") {
        let newImage = event.target.dataset.full;
        document.getElementById("mainImage").src = newImage;
    }

});
</script>

</body>
</html>
